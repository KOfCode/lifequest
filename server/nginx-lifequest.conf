  # --- LifeQuest (added) ---
  location ^~ /lifequest/api/ { proxy_pass http://127.0.0.1:3100/; proxy_set_header Host $host; client_max_body_size 3m; add_header Cache-Control "no-store" always; }
  location ^~ /lifequest/ { alias /var/www/lifequest/; index index.html; location ~ sw\.js$ { add_header Cache-Control "no-cache" always; } }
  location = /lifequest { return 301 /lifequest/; }
  # --- /LifeQuest ---
