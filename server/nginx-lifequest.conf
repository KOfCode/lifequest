  # --- LifeQuest (added) ---
  location ^~ /lifequest/api/ { proxy_pass http://127.0.0.1:3100/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; client_max_body_size 110m; proxy_request_buffering off; proxy_read_timeout 600s; proxy_send_timeout 600s; add_header Cache-Control "no-store" always; }
  location ^~ /lifequest/ { alias /var/www/lifequest/; index index.html; location ~ sw\.js$ { add_header Cache-Control "no-cache" always; } }
  location = /lifequest { return 301 /lifequest/; }
  # --- /LifeQuest ---
